<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000">
  <!-- Cover only the four outside corners of the hue base, matching the panel. -->
  <polygon points="0,0 500,0 0,500" fill="#383b40" />
  <polygon points="500,0 1000,0 1000,500" fill="#383b40" />
  <polygon points="1000,500 1000,1000 500,1000" fill="#383b40" />
  <polygon points="500,1000 0,1000 0,500" fill="#383b40" />
</svg>
